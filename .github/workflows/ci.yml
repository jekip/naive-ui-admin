name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: ESLint
        run: pnpm exec eslint "{src,mock,build,scripts}/**/*.{vue,ts,tsx,mjs}"

      - name: Stylelint
        run: pnpm exec stylelint "src/**/*.{vue,less,css}"

      - name: Build
        run: pnpm build

      # 体积预算：首屏 gzip 超过 500KB 直接失败，防止包体悄悄回涨
      # 默认构建带 mock（faker + mockjs 约 0.5MB），接入真实后端后约为 239KB
      - name: Bundle size budget
        run: pnpm exec cross-env BUNDLE_BUDGET_KB=500 node scripts/report-bundle-size.mjs dist
